[project]
name = "zk-utils"
version = "0.4.1"
description = "MCP server for zk note management with search, linking, and organization tools"
readme = "README.md"
authors = [
    { name = "koei-kaji", email = "koei.kaji@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=2,<3",
    "pydantic-settings>=2.14.2",
    "injector>=0.22.0",
    "markdown-it-pyrs>=0.4.0",
]

[project.scripts]
zk-utils-mcp = "zk_utils.presentation.mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.3.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.11.5",
    "ty>=0.0.8",
]

[tool.uv]
constraint-dependencies = [
    "cryptography>=50.0.0",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "starlette>=1.3.1",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
